<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tally Table">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e6e9ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12151a" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
</style>
<title>Tally Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600&family=Saira+Extra+Condensed:wght@600;700&display=swap">
<style>
/* Layout: one-screen tool. Header (title, per-tap amount, new game) over a scrolling grid of counter tiles.
   Life spans the full width. Every tile is split into a minus half and a plus half.
   The five mana colours appear only as pips and tints, so the numbers stay readable. */
:root{
  --font-display:"Saira Extra Condensed","Arial Narrow","Helvetica Neue",sans-serif;
  --font-body:"Albert Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --bg:#e6e9ee;
  --surface:#f6f7f9;
  --surface-2:#e9edf1;
  --ink:#15191f;
  --muted:#56606c;
  --line:#c9d0d8;
  --accent:#3556d8;
  --danger:#b3301d;
  --on-danger:#ffffff;
  --scrim:rgba(15,18,24,.45);
  --w:#e2d79e;
  --u:#2c7cc0;
  --b:#54445f;
  --r:#d0472c;
  --g:#3a8752;
  --c:#858d96;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151a;
    --surface:#1b2027;
    --surface-2:#252b34;
    --ink:#eef1f5;
    --muted:#9aa3af;
    --line:#2f3641;
    --accent:#7f9bff;
    --danger:#ff7b66;
    --on-danger:#1a0a07;
    --scrim:rgba(0,0,0,.6);
    --w:#e6dba6;
    --u:#5aa6e8;
    --b:#a592b4;
    --r:#f0694d;
    --g:#5fbb7c;
    --c:#a2abb5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12151a;
  --surface:#1b2027;
  --surface-2:#252b34;
  --ink:#eef1f5;
  --muted:#9aa3af;
  --line:#2f3641;
  --accent:#7f9bff;
  --danger:#ff7b66;
  --on-danger:#1a0a07;
  --scrim:rgba(0,0,0,.6);
  --w:#e6dba6;
  --u:#5aa6e8;
  --b:#a592b4;
  --r:#f0694d;
  --g:#5fbb7c;
  --c:#a2abb5;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  display:flex;flex-direction:column;
  width:100%;max-width:46rem;margin-inline:auto;
  padding-inline:16px;padding-block:0;
  background:var(--bg);color:var(--ink);
  font-family:var(--font-body);font-size:1rem;line-height:1.35;
  overflow:hidden;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.m-w{--pip:var(--w)}
.m-u{--pip:var(--u)}
.m-b{--pip:var(--b)}
.m-r{--pip:var(--r)}
.m-g{--pip:var(--g)}
.m-c{--pip:var(--c)}

/* header */
.top{display:grid;gap:.5rem;padding-block:.75rem .5rem}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:.75rem;min-width:0}
h1{
  margin:0;font-family:var(--font-display);font-weight:700;
  font-size:1.9rem;line-height:1;letter-spacing:.04em;text-transform:uppercase;
}
.seg{display:flex;align-items:center;gap:.4rem;min-width:0}
.seg-label{
  margin-right:.15rem;font-size:.75rem;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
}
.seg button{
  min-width:2.75rem;height:2.5rem;padding:0 .75rem;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);
  font-weight:600;font-size:.9375rem;font-variant-numeric:tabular-nums;
}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hint{margin:0;font-size:.8125rem;color:var(--muted);text-align:right}

.btn{
  height:2.75rem;padding:0 1rem;border-radius:.7rem;
  border:1px solid var(--line);background:var(--surface-2);
  font-weight:600;font-size:.9375rem;
}
.btn.small{height:2.5rem;padding:0 .9rem}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.armed{background:var(--danger);border-color:var(--danger);color:var(--on-danger)}
.btn.danger{color:var(--danger)}
.wide-btn{width:100%}

/* board */
.board{
  flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;padding-block:.25rem .75rem;
}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(10rem,1fr));gap:.75rem;align-items:start}
@media (min-width:24rem){.tile.sz-l,.tile.sz-xl{grid-column:span 2}}
.tile.editing{grid-column:1/-1}

.tile{
  display:flex;flex-direction:column;gap:.5rem;min-width:0;
  padding:.75rem;border-radius:1rem;
  background:var(--surface);border:1px solid var(--line);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
.tile.lethal{border-color:var(--danger)}
.tile-head{display:flex;align-items:center;gap:.5rem;min-width:0}
.pip{
  flex:none;width:.95rem;height:.95rem;border-radius:50%;
  background:var(--pip);box-shadow:0 0 0 1px var(--line);
}
.ico{
  flex:none;display:inline-grid;place-items:center;width:1.5rem;height:1.5rem;
  color:color-mix(in srgb,var(--pip) 60%,var(--ink));
}
.ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(2.75rem,1fr));gap:.4rem}
.ic{
  height:2.75rem;display:grid;place-items:center;padding:0;border-radius:.6rem;
  border:1px solid var(--line);background:var(--surface-2);
}
.ic .ico{width:1.6rem;height:1.6rem;color:var(--ink)}
.ic{position:relative}
.ic[data-tip]::after{
  content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + .35rem);transform:translateX(-50%);
  z-index:5;padding:.25rem .55rem;border-radius:.4rem;white-space:nowrap;pointer-events:none;
  background:var(--ink);color:var(--bg);font:600 .75rem/1.2 var(--font-body);
  opacity:0;visibility:hidden;transition:opacity .12s;
}
@media (hover:hover){.ic[data-tip]:hover::after{opacity:1;visibility:visible}}
.ic[data-tip]:focus-visible::after{opacity:1;visibility:visible}
.ic-none{font-size:.75rem;font-weight:600;color:var(--muted)}
.ic[aria-checked="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ic[aria-checked="true"] .ico,.ic[aria-checked="true"].ic-none{color:var(--bg)}
.tile-name{
  flex:1;min-width:0;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font:600 .8125rem/1.2 var(--font-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
}
.icon-btn{
  flex:none;width:2.5rem;height:2.5rem;margin:-.4rem -.4rem -.4rem 0;
  display:grid;place-items:center;border:0;border-radius:.6rem;background:transparent;color:var(--muted);
}

.dial{
  position:relative;display:grid;grid-template-columns:1fr 1fr;gap:2px;
  min-height:7.5rem;border-radius:.75rem;overflow:hidden;background:var(--line);
}
.sz-s{padding:.6rem}
.sz-s .dial{min-height:5rem}
.sz-l .dial{min-height:10rem}
.sz-xl .dial{min-height:15rem}
.sz-s .glyph{font-size:1.6rem}
.zone{
  display:flex;align-items:center;border:0;padding:0 .9rem;
  background:var(--surface-2);
  -webkit-tap-highlight-color:transparent;
}
.zone.minus{justify-content:flex-start}
.zone.plus{
  justify-content:flex-end;
  background:var(--surface-2);
  background:color-mix(in srgb,var(--pip) 20%,var(--surface-2));
}
.zone:active{background:var(--line)}
.zone.plus:active{background:color-mix(in srgb,var(--pip) 36%,var(--surface-2))}
.glyph{font-family:var(--font-display);font-weight:600;font-size:2.1rem;line-height:1;color:var(--muted)}
.zone.plus .glyph{color:var(--ink)}

.num{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.num-v{
  font-family:var(--font-display);font-weight:700;font-size:4.25rem;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:.01em;
}
.sz-s .num-v{font-size:2.9rem}
.sz-l .num-v{font-size:7rem}
.sz-xl .num-v{font-size:10rem}
.tile.lethal .num-v{color:var(--danger)}

.foot{display:flex;align-items:center;justify-content:space-between;gap:.5rem;min-height:1.5rem}
.note{font-size:.8125rem;color:var(--muted)}
.note.pill{
  padding:.1rem .6rem;border-radius:999px;font-weight:600;
  background:var(--danger);color:var(--on-danger);
}
.delta{font-size:.9375rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}

/* edit panel */
.panel{display:grid;gap:.75rem;padding-top:.5rem;border-top:1px solid var(--line)}
.field{display:grid;gap:.3rem;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.flabel{font-size:.75rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.panel input{
  width:100%;min-width:0;height:2.75rem;padding:0 .75rem;border-radius:.6rem;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
  font:500 1rem var(--font-body);
  -webkit-user-select:text;user-select:text;
}
.swatches{display:flex;flex-wrap:wrap;gap:.6rem;padding:.25rem}
.sw{
  width:2.25rem;height:2.25rem;border-radius:50%;border:0;background:var(--pip);
  box-shadow:0 0 0 1px var(--line);
}
.sw[aria-checked="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:.4rem}
.opt{
  flex:1 1 auto;min-width:3.5rem;height:2.5rem;padding:0 .6rem;border-radius:.6rem;
  border:1px solid var(--line);background:var(--surface-2);
  font-weight:600;font-size:.875rem;
}
.opt[aria-checked="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:.5rem}
.actions .btn{flex:1 1 7rem}

/* dock */
.dock{padding-block:.5rem .75rem}

/* empty state */
.empty{display:grid;gap:.4rem;padding:2.5rem 1rem;text-align:center;color:var(--muted)}
.empty-title{margin:0;font-family:var(--font-display);font-size:1.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink)}
.empty p{margin:0}

/* add sheet */
.sheet{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet-back{position:absolute;inset:0;background:var(--scrim)}
.sheet-panel{
  position:relative;width:100%;max-width:46rem;max-height:82%;overflow-y:auto;
  padding:1rem 16px calc(1rem + env(safe-area-inset-bottom,0px));
  background:var(--surface);border-top:1px solid var(--line);border-radius:1.25rem 1.25rem 0 0;
}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.75rem}
.sheet-head h2{margin:0;font-family:var(--font-display);font-size:1.5rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.5rem}
.chip{
  display:flex;align-items:center;gap:.6rem;min-width:0;padding:.7rem .75rem;text-align:left;
  border:1px solid var(--line);border-radius:.8rem;background:var(--surface-2);
}
.chip-text{display:grid;min-width:0}
.chip-name{font-weight:600;font-size:.9375rem;line-height:1.2}
.chip-meta{font-size:.75rem;color:var(--muted)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>


<header class="top">
  <div class="top-row">
    <h1>Tally Table</h1>
    <button id="reset" class="btn small" type="button">New game</button>
  </div>
  <div class="top-row">
    <div class="seg" id="steps" role="group" aria-label="Amount per tap">
      <span class="seg-label">Per tap</span>
      <button type="button" data-step="1" aria-pressed="true">1</button>
      <button type="button" data-step="5" aria-pressed="false">5</button>
      <button type="button" data-step="10" aria-pressed="false">10</button>
    </div>
    <p class="hint">Hold to repeat</p>
  </div>
</header>

<main id="board" class="board" aria-label="Counters"></main>

<footer class="dock">
  <button id="add" class="btn primary wide-btn" type="button">Add counter</button>
</footer>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-back" id="sheetBack"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle">Add a counter</h2>
      <button id="sheetClose" class="btn small" type="button">Close</button>
    </div>
    <div id="chips" class="chips"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var KEY = 'tally-table-v1';
  var COLORS = [['w', 'White'], ['u', 'Blue'], ['b', 'Black'], ['r', 'Red'], ['g', 'Green'], ['c', 'Colorless']];
  var SIZES = [['s', 'Compact'], ['m', 'Standard'], ['l', 'Wide'], ['xl', 'Jumbo']];
  /* Icon library: 24x24 line drawings, stroked with currentColor. Add an entry to offer a new icon. */
  var ICONS = [
    ['heart', 'Heart', '<path d="M12 20.5C5 15.5 3 12 3 8.8A4.8 4.8 0 0 1 12 6.6a4.8 4.8 0 0 1 9 2.2c0 3.2-2 6.7-9 11.700z"/>'],
    ['skull', 'Skull', '<path d="M12 3a8 8 0 0 0-8 8c0 2.6 1.2 4.2 3 5.200V20h10v-3.800c1.8-1 3-2.6 3-5.200a8 8 0 0 0-8-8z"/><circle cx="9" cy="11.5" r="1.6"/><circle cx="15" cy="11.5" r="1.6"/><path d="M10.5 20v-2.500M13.5 20v-2.5"/>'],
    ['sword', 'Sword', '<path d="M20 4v5L10 19l-5-5L15 4zM5 19l-2 2M8 13l3 3"/>'],
    ['shield', 'Shield', '<path d="M12 3 4.5 6v5.500c0 4.5 3.2 8 7.5 9.5 4.3-1.5 7.5-5 7.5-9.500V6z"/>'],
    ['crown', 'Crown', '<path d="M4 18h16M4.5 17 3.5 7.5 8.5 11 12 5l3.5 6 5-3.5-1 9.500z"/>'],
    ['coin', 'Coin', '<circle cx="12" cy="12" r="8.5"/><path d="M14.5 9.200c-.5-.8-1.5-1.2-2.5-1.2-1.5 0-2.5.8-2.5 2 0 2.7 5 1.3 5 4 0 1.2-1 2-2.5 2-1.1 0-2.1-.5-2.6-1.300M12 6.500V8M12 16v1.5"/>'],
    ['gem', 'Gem', '<path d="M6.5 4h11l3.5 5-9 11L3 9zM3 9h18M9.5 4 8 9l4 11 4-11-1.5-5"/>'],
    ['bolt', 'Bolt', '<path d="M13 2.5 5 13.500h6l-1 8 8-11h-6z"/>'],
    ['star', 'Star', '<path d="m12 3 2.7 5.6 6.1.8-4.5 4.2 1.1 6.100L12 16.800l-5.4 2.9 1.1-6.100L3.2 9.400l6.1-.8z"/>'],
    ['flame', 'Flame', '<path d="M12 21c-4 0-6.5-2.7-6.5-6 0-3.5 2.8-5 3.5-9 2.5 1.5 3.5 3.5 3.5 5.5.8-.5 1.5-1.5 1.5-3 2 1.5 4 4 4 6.5 0 3.3-2.5 6-6 6z"/>'],
    ['drop', 'Water', '<path d="M12 3C8 8.5 5.5 11.5 5.5 15a6.5 6.5 0 0 0 13 0C18.5 11.5 16 8.5 12 3z"/>'],
    ['leaf', 'Leaf', '<path d="M5 19C4 10 9 5 20 4c0 11-5 16-13 15zM5 19c3-4 6-7 10-9"/>'],
    ['sun', 'Sun', '<circle cx="12" cy="12" r="4"/><path d="M12 2.500v3M12 18.500v3M2.5 12h3M18.5 12h3M5.3 5.300l2.1 2.100M16.6 16.600l2.1 2.100M5.3 18.700l2.1-2.100M16.6 7.400l2.1-2.1"/>'],
    ['moon', 'Moon', '<path d="M20 14.500A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.500z"/>'],
    ['snow', 'Snowflake', '<path d="M12 3v18M4.2 7.500l15.6 9M4.2 16.500l15.6-9M9.5 4.5 12 6.500l2.5-2M9.5 19.5 12 17.500l2.5 2"/>'],
    ['eye', 'Eye', '<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>'],
    ['book', 'Book', '<path d="M4 5.500A1.5 1.5 0 0 1 5.5 4H20v14H5.500A1.5 1.5 0 0 0 4 19.500zM4 19.500A1.5 1.5 0 0 0 5.5 21H20v-3"/>'],
    ['wand', 'Wand', '<path d="m4 20 11-11M14 6l4 4M18 3v3M16.5 4.500h3M20 12v2M19 13h2M7 4v2M6 5h2"/>'],
    ['swirl', 'Swirl', '<path d="M12 12m-1 0a1 1 0 1 0 2 0 1 1 0 1 0-2 0M12 11c0-2.5 3.5-2.5 3.5.5S11 16.5 8.5 14 8 7 12 6s8 2.5 8 6.5-3.5 8-8 8"/>'],
    ['plus', 'Plus', '<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/>'],
    ['clock', 'Clock', '<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/>'],
    ['key', 'Key', '<circle cx="8" cy="15" r="4"/><path d="m11 12 8.5-8.500M16 7l2.5 2.500M14 9l2 2"/>'],
    ['paw', 'Beast', '<circle cx="6.5" cy="10" r="1.8"/><circle cx="10" cy="6.5" r="1.8"/><circle cx="14" cy="6.5" r="1.8"/><circle cx="17.5" cy="10" r="1.8"/><path d="M12 12c-3 0-5.5 3-5.5 5.2 0 1.8 1.8 2.3 3 1.8 1-.4 1.6-.6 2.5-.6s1.5.2 2.5.6c1.2.5 3-.1 3-1.800C17.5 15 15 12 12 12z"/>'],
    ['food', 'Food', '<path d="M12 7.500C10 6 4.500 7 4.500 13c0 4 3 8 5.500 8 1 0 1.500-.5 2-.5s1 .5 2 .5c2.500 0 5.500-4 5.500-8 0-6-5.500-7-7.500-5.500zM12 7.500c0-2 1-3.500 2.500-4"/>'],
    ['x', 'Cross', '<path d="M6 6l12 12M18 6 6 18"/>']
  ];
  var ICON_MAP = {};
  ICONS.forEach(function (x) { ICON_MAP[x[0]] = x; });

  var PRESETS = [
    { name: 'Life (Commander)', meta: 'Starts at 40', label: 'Life', start: 40, color: 'w', icon: 'heart', kill: 'low', killAt: 0, size: 'l' },
    { name: 'Life (20)', meta: 'Starts at 20', label: 'Life', start: 20, color: 'w', icon: 'heart', kill: 'low', killAt: 0, size: 'l' },
    { name: 'Poison', meta: 'Lethal at 10', label: 'Poison', start: 0, color: 'g', icon: 'skull', kill: 'high', killAt: 10 },
    { name: 'Commander damage', meta: 'Lethal at 21', label: 'Commander damage', start: 0, color: 'b', icon: 'sword', kill: 'high', killAt: 21 },
    { name: 'Tokens', meta: 'Starts at 0', label: 'Tokens', start: 0, color: 'g', icon: 'paw' },
    { name: 'Treasure', meta: 'Starts at 0', label: 'Treasure', start: 0, color: 'c', icon: 'coin' },
    { name: 'Energy', meta: 'Starts at 0', label: 'Energy', start: 0, color: 'c', icon: 'bolt' },
    { name: 'Experience', meta: 'Starts at 0', label: 'Experience', start: 0, color: 'u', icon: 'star' },
    { name: 'Storm count', meta: 'Starts at 0', label: 'Storm', start: 0, color: 'r', icon: 'swirl' },
    { name: '+1/+1 counters', meta: 'Starts at 0', label: '+1/+1', start: 0, color: 'g', icon: 'plus' },
    { name: 'Blank counter', meta: 'Name it yourself', label: 'Counter', start: 0, color: 'c', blank: true }
  ];

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
  function clamp(n) { return Math.max(-999, Math.min(9999, n)); }

  function mk(p) {
    return {
      id: uid(), label: p.label, value: p.start, start: p.start, color: p.color,
      icon: p.icon || '', kill: p.kill || null, killAt: p.killAt || 0, alert: '',
      size: p.size || 'm', foot: 'auto', footText: ''
    };
  }
  function defaults() { return [PRESETS[0], PRESETS[2], PRESETS[3], PRESETS[4], PRESETS[5]].map(mk); }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return null;
      var d = JSON.parse(raw);
      if (!d || !Array.isArray(d.counters)) return null;
      var cs = d.counters
        .filter(function (c) { return c && typeof c.id === 'string' && typeof c.value === 'number'; })
        .map(function (c) {
          return {
            id: c.id,
            label: String(c.label || 'Counter').slice(0, 24),
            value: clamp(Math.trunc(c.value) || 0),
            start: clamp(Math.trunc(c.start) || 0),
            color: COLORS.some(function (x) { return x[0] === c.color; }) ? c.color : 'c',
            icon: ICON_MAP[c.icon] ? c.icon : '',
            kill: c.kill === 'low' || c.kill === 'high' ? c.kill : null,
            killAt: Math.trunc(Number(c.killAt)) || 0,
            alert: String(c.alert || '').slice(0, 16),
            size: SIZES.some(function (x) { return x[0] === c.size; }) ? c.size : (c.wide ? 'l' : 'm'),
            foot: c.foot === 'custom' || c.foot === 'off' ? c.foot : 'auto',
            footText: String(c.footText || '').slice(0, 60)
          };
        });
      return { step: [1, 5, 10].indexOf(d.step) >= 0 ? d.step : 1, counters: cs };
    } catch (e) { return null; }
  }

  var state = load() || { step: 1, counters: defaults() };
  var deltas = new Map();
  var editingId = null;
  var armedDelete = null;

  var saveTimer = null;
  function flush() {
    clearTimeout(saveTimer);
    try { localStorage.setItem(KEY, JSON.stringify({ step: state.step, counters: state.counters })); } catch (e) {}
  }
  function save() { clearTimeout(saveTimer); saveTimer = setTimeout(flush, 120); }
  window.addEventListener('pagehide', flush);

  /* keep the screen on while the game is running */
  var lock = null;
  function wake() {
    try {
      if (!lock && navigator.wakeLock && document.visibilityState === 'visible') {
        navigator.wakeLock.request('screen').then(function (l) {
          lock = l;
          l.addEventListener('release', function () { lock = null; });
        }, function () {});
      }
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') wake(); });

  function h(tag, props) {
    var el = document.createElement(tag);
    var p = props || {};
    Object.keys(p).forEach(function (k) {
      var v = p[k];
      if (v == null || v === false) return;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    });
    for (var i = 2; i < arguments.length; i++) {
      [].concat(arguments[i]).forEach(function (kid) {
        if (kid == null || kid === false) return;
        el.append(kid.nodeType ? kid : document.createTextNode(kid));
      });
    }
    return el;
  }

  function iconEl(name) {
    var ic = ICON_MAP[name];
    if (!ic) return h('span', { class: 'pip', 'aria-hidden': 'true' });
    var s = h('span', { class: 'ico', 'aria-hidden': 'true' });
    s.innerHTML = '<svg viewBox="0 0 24 24">' + ic[2] + '</svg>';
    return s;
  }

  function fmt(v) { return String(v).replace('-', '−'); }
  function fmtDelta(v) { return v === 0 ? '' : (v > 0 ? '+' : '−') + Math.abs(v); }
  function isLethal(c) {
    return c.kill === 'low' ? c.value <= c.killAt : c.kill === 'high' ? c.value >= c.killAt : false;
  }
  function alertWord(c) { return c.alert || (c.kill === 'low' ? 'Out' : 'Lethal'); }
  function noteText(c) {
    if (c.foot === 'off') return '';
    if (c.foot === 'custom') return c.footText;
    return c.kill ? alertWord(c) + ' at ' + fmt(c.killAt) : '';
  }
  function find(id) { return state.counters.find(function (x) { return x.id === id; }); }
  function tileEl(id) { return document.querySelector('[data-id="' + id + '"]'); }

  function updateTile(c) {
    var el = tileEl(c.id);
    if (!el) return;
    el.querySelector('.num-v').textContent = fmt(c.value);
    var l = isLethal(c);
    el.classList.toggle('lethal', l);
    var note = el.querySelector('.note');
    note.textContent = l ? alertWord(c) : noteText(c);
    note.classList.toggle('pill', l);
    var d = deltas.get(c.id);
    el.querySelector('.delta').textContent = d ? fmtDelta(d.v) : '';
    var vi = document.getElementById('v-' + c.id);
    if (vi && document.activeElement !== vi) vi.value = String(c.value);
  }

  function bump(id, d) {
    var c = find(id);
    if (!c) return;
    var nv = clamp(c.value + d);
    if (nv === c.value) return;
    var applied = nv - c.value;
    c.value = nv;
    var cur = deltas.get(id) || { v: 0, t: 0 };
    clearTimeout(cur.t);
    cur.v += applied;
    cur.t = setTimeout(function () { deltas.delete(id); updateTile(c); }, 1600);
    deltas.set(id, cur);
    updateTile(c);
    save();
  }

  /* a tap applies on release, so starting a scroll on a tile never changes a number */
  function zone(c, dir) {
    var b = h('button', {
      class: 'zone ' + (dir < 0 ? 'minus' : 'plus'), type: 'button',
      'aria-label': (dir < 0 ? 'Decrease ' : 'Increase ') + c.label
    }, h('span', { class: 'glyph', 'aria-hidden': 'true', text: dir < 0 ? '−' : '+' }));
    var holdTimer = null, repeat = null, down = false, repeating = false;
    function stop() { clearTimeout(holdTimer); clearInterval(repeat); holdTimer = repeat = null; down = false; repeating = false; }
    b.addEventListener('pointerdown', function (e) {
      if (e.button > 0) return;
      down = true; repeating = false; wake();
      holdTimer = setTimeout(function () {
        repeating = true;
        bump(c.id, dir * state.step);
        repeat = setInterval(function () { bump(c.id, dir * state.step); }, 110);
      }, 420);
    });
    b.addEventListener('pointerup', function () {
      var tap = down && !repeating;
      stop();
      if (tap) bump(c.id, dir * state.step);
    });
    b.addEventListener('pointercancel', stop);
    b.addEventListener('pointerleave', stop);
    b.addEventListener('click', function (e) { if (e.detail === 0) bump(c.id, dir * state.step); });
    return b;
  }

  function dots() {
    var s = document.createElement('span');
    s.innerHTML = '<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>';
    return s;
  }

  function field(label, forId, input) {
    return h('div', { class: 'field' }, h('label', { class: 'flabel', 'for': forId, text: label }), input);
  }

  function opts(label, list, current, pick) {
    return h('div', { class: 'field' },
      h('span', { class: 'flabel', text: label }),
      h('div', { class: 'opts', role: 'radiogroup', 'aria-label': label },
        list.map(function (x) {
          return h('button', {
            class: 'opt', type: 'button', role: 'radio', 'aria-checked': String(current === x[0]), text: x[1],
            onclick: function () { pick(x[0]); }
          });
        })));
  }

  function editPanel(c) {
    var nid = 'n-' + c.id;
    var name = h('input', {
      id: nid, type: 'text', value: c.label, maxlength: '24', autocomplete: 'off', autocapitalize: 'words',
      oninput: function (e) {
        c.label = e.target.value;
        var t = document.querySelector('[data-id="' + c.id + '"] .tile-name');
        if (t) t.textContent = c.label || 'Counter';
        save();
      }
    });
    var val = h('input', {
      id: 'v-' + c.id, type: 'number', step: '1', value: String(c.value),
      onchange: function (e) {
        var n = parseInt(e.target.value, 10);
        if (isNaN(n)) { e.target.value = String(c.value); return; }
        c.value = clamp(n); e.target.value = String(c.value);
        updateTile(c); save();
      }
    });
    var start = h('input', {
      id: 's-' + c.id, type: 'number', step: '1', value: String(c.start),
      onchange: function (e) {
        var n = parseInt(e.target.value, 10);
        if (isNaN(n)) { e.target.value = String(c.start); return; }
        c.start = clamp(n); e.target.value = String(c.start); save();
      }
    });
    var sw = h('div', { class: 'swatches', role: 'radiogroup', 'aria-label': 'Mana colour' },
      COLORS.map(function (x) {
        return h('button', {
          class: 'sw m-' + x[0], type: 'button', role: 'radio', 'aria-checked': String(c.color === x[0]), 'aria-label': x[1],
          onclick: function () { c.color = x[0]; save(); render(); }
        });
      }));
    var picker = h('div', { class: 'icons', role: 'radiogroup', 'aria-label': 'Icon' },
      [h('button', {
        class: 'ic ic-none', type: 'button', role: 'radio', 'aria-checked': String(!c.icon), 'aria-label': 'No icon', 'data-tip': 'No icon', text: 'None',
        onclick: function () { c.icon = ''; save(); render(); }
      })].concat(ICONS.map(function (x) {
        return h('button', {
          class: 'ic', type: 'button', role: 'radio', 'aria-checked': String(c.icon === x[0]), 'aria-label': x[1], 'data-tip': x[1],
          onclick: function () { c.icon = x[0]; save(); render(); }
        }, iconEl(x[0]));
      })));
    var sizeOpts = opts('Tile size', SIZES, c.size, function (v) { c.size = v; save(); render(); });
    var footOpts = opts('Footer text', [['auto', 'Auto'], ['custom', 'Custom'], ['off', 'Off']], c.foot, function (v) { c.foot = v; save(); render(); });
    var footInput = c.foot === 'custom' ? field('Custom footer', 'f-' + c.id, h('input', {
      id: 'f-' + c.id, type: 'text', value: c.footText, maxlength: '60', autocomplete: 'off',
      placeholder: 'e.g. Infect at 10',
      oninput: function (e) { c.footText = e.target.value; updateTile(c); save(); }
    })) : null;
    var ruleOpts = opts('Alert rule', [['none', 'None'], ['high', 'At or above'], ['low', 'At or below']], c.kill || 'none', function (v) {
      c.kill = v === 'none' ? null : v; save(); render();
    });
    var ruleFields = c.kill ? h('div', { class: 'two' },
      field('Threshold', 'k-' + c.id, h('input', {
        id: 'k-' + c.id, type: 'number', step: '1', value: String(c.killAt),
        oninput: function (e) {
          var n = parseInt(e.target.value, 10);
          if (isNaN(n)) return;
          c.killAt = clamp(n); updateTile(c); save();
        }
      })),
      field('Alert text', 'a-' + c.id, h('input', {
        id: 'a-' + c.id, type: 'text', value: c.alert, maxlength: '16', autocomplete: 'off',
        placeholder: c.kill === 'low' ? 'Out' : 'Lethal',
        oninput: function (e) { c.alert = e.target.value; updateTile(c); save(); }
      }))) : null;
    var del = h('button', { class: 'btn danger', type: 'button', text: 'Delete' });
    del.addEventListener('click', function () {
      if (armedDelete !== c.id) {
        armedDelete = c.id;
        del.textContent = 'Tap again to delete';
        del.classList.add('armed');
        setTimeout(function () {
          if (armedDelete === c.id) { armedDelete = null; del.textContent = 'Delete'; del.classList.remove('armed'); }
        }, 3000);
        return;
      }
      state.counters = state.counters.filter(function (x) { return x.id !== c.id; });
      deltas.delete(c.id);
      editingId = null; armedDelete = null;
      save(); render();
    });
    var done = h('button', { class: 'btn primary', type: 'button', text: 'Done', onclick: function () { editingId = null; armedDelete = null; render(); } });
    return h('div', { class: 'panel' },
      field('Name', nid, name),
      h('div', { class: 'two' }, field('Value', 'v-' + c.id, val), field('New game value', 's-' + c.id, start)),
      h('div', { class: 'field' }, h('span', { class: 'flabel', text: 'Colour' }), sw),
      h('div', { class: 'field' }, h('span', { class: 'flabel', text: 'Icon' }), picker),
      sizeOpts,
      footOpts, footInput,
      ruleOpts, ruleFields,
      h('div', { class: 'actions' }, del, done));
  }

  function tile(c) {
    var editing = editingId === c.id;
    var root = h('section', {
      class: 'tile m-' + c.color + ' sz-' + c.size + (editing ? ' editing' : ''),
      'data-id': c.id
    });
    var head = h('div', { class: 'tile-head' },
      iconEl(c.icon),
      h('h2', { class: 'tile-name', text: c.label || 'Counter' }),
      h('button', {
        class: 'icon-btn', type: 'button', 'aria-label': 'Edit ' + (c.label || 'counter'), 'aria-expanded': String(editing),
        onclick: function () { toggleEdit(c.id); }
      }, dots()));
    var dial = h('div', { class: 'dial' },
      zone(c, -1), zone(c, 1),
      h('div', { class: 'num', 'aria-live': 'polite' }, h('span', { class: 'num-v' })));
    var foot = h('div', { class: 'foot' }, h('span', { class: 'note' }), h('span', { class: 'delta', 'aria-hidden': 'true' }));
    root.append(head, dial, foot);
    if (editing) root.append(editPanel(c));
    return root;
  }

  var board = document.getElementById('board');
  board.addEventListener('contextmenu', function (e) { if (e.target.closest('.tile') && !e.target.closest('input')) e.preventDefault(); });

  function emptyState() {
    return h('div', { class: 'empty' },
      h('p', { class: 'empty-title', text: 'Nothing to count yet' }),
      h('p', { text: 'Add life, poison, commander damage or tokens to start the game.' }));
  }

  function render() {
    board.replaceChildren();
    if (!state.counters.length) { board.append(emptyState()); return; }
    board.append(h('div', { class: 'grid' }, state.counters.map(tile)));
    state.counters.forEach(updateTile);
  }

  function toggleEdit(id) {
    editingId = editingId === id ? null : id;
    armedDelete = null;
    render();
    if (editingId) { var el = tileEl(editingId); if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  }

  /* per-tap amount */
  var stepBtns = [].slice.call(document.querySelectorAll('#steps button'));
  function syncSteps() {
    stepBtns.forEach(function (b) { b.setAttribute('aria-pressed', String(Number(b.dataset.step) === state.step)); });
  }
  stepBtns.forEach(function (b) {
    b.addEventListener('click', function () { state.step = Number(b.dataset.step); syncSteps(); save(); });
  });

  /* new game (two taps) */
  var resetBtn = document.getElementById('reset');
  var resetTimer = null;
  function disarm() { clearTimeout(resetTimer); resetTimer = null; resetBtn.textContent = 'New game'; resetBtn.classList.remove('armed'); }
  resetBtn.addEventListener('click', function () {
    if (!resetTimer) {
      resetBtn.textContent = 'Reset all?';
      resetBtn.classList.add('armed');
      resetTimer = setTimeout(disarm, 3000);
      return;
    }
    disarm();
    state.counters.forEach(function (c) { c.value = c.start; });
    deltas.forEach(function (d) { clearTimeout(d.t); });
    deltas.clear();
    state.counters.forEach(updateTile);
    save();
  });

  /* add sheet */
  var sheet = document.getElementById('sheet');
  var chips = document.getElementById('chips');
  function openSheet() { sheet.hidden = false; document.getElementById('sheetClose').focus(); }
  function closeSheet() { sheet.hidden = true; document.getElementById('add').focus(); }
  function addPreset(p) {
    var c = mk(p);
    state.counters.push(c);
    editingId = p.blank ? c.id : null;
    sheet.hidden = true;
    save(); render();
    board.scrollTo({ top: board.scrollHeight, behavior: 'smooth' });
  }
  PRESETS.forEach(function (p) {
    chips.append(h('button', { class: 'chip m-' + p.color, type: 'button', onclick: function () { addPreset(p); } },
      iconEl(p.icon),
      h('span', { class: 'chip-text' },
        h('span', { class: 'chip-name', text: p.name }),
        h('span', { class: 'chip-meta', text: p.meta }))));
  });
  document.getElementById('add').addEventListener('click', openSheet);
  document.getElementById('sheetClose').addEventListener('click', closeSheet);
  document.getElementById('sheetBack').addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !sheet.hidden) closeSheet(); });

  syncSteps();
  render();
})();
</script>

</body>
</html>
